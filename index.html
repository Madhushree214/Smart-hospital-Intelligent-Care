<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Hospital Management System</title>
  </head>
  <body>
    <!-- Red geometric art overlay (marble/veins) -->
    <svg id="bg-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" style="position:fixed; right:-5%; top:-10%; width:60%; height:60%; z-index:1; pointer-events:none; mix-blend-mode:multiply; opacity:0.45; filter: blur(0.6px) saturate(140%);">
      <g stroke="#ff1a1a" stroke-width="2" fill="none" stroke-linejoin="round">
        <polyline points="80,480 200,320 360,420 520,300 700,480" />
        <polyline points="120,420 260,280 400,360 580,260 740,420" />
      </g>
      <g fill="#ff1a1a" fill-opacity="0.08" stroke="none">
        <polygon points="520,120 620,160 580,240" />
        <polygon points="640,40 760,80 700,160" />
      </g>
      <g stroke="#ff1a1a" stroke-opacity="0.45" stroke-width="1">
        <line x1="360" y1="420" x2="640" y2="160" />
        <line x1="200" y1="320" x2="520" y2="300" />
        <line x1="260" y1="280" x2="740" y2="420" />
      </g>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
